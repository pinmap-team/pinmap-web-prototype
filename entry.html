  <main>
    <span class="wordmark">PINMAP</span>
    <h1>어떤 버전으로<br>시작할까요?</h1>
    <p class="intro">목적에 맞는 환경을 선택해 주세요.</p>
    <div class="choices">
      <a class="choice" href="index.html?mode=development" target="_top">
        <span class="eyebrow">DEVELOPMENT</span>
        <h2>개발 테스트 <span aria-hidden="true">↗</span></h2>

      </a>
      <a class="choice" href="index.html?mode=prototype" target="_top">
        <span class="eyebrow">PROTOTYPE</span>
        <h2>프로토타입 체험 <span aria-hidden="true">↗</span></h2>
        <p>저장된 예시 콘텐츠와 기능으로<br>핀맵을 둘러볼 수 있어요.</p>
      </a>
      <a class="choice" href="auth.html?screen=welcome" target="_top">
        <span class="eyebrow">LOGIN</span>
        <h2>로그인 테스트 <span aria-hidden="true">↗</span></h2>
        <p>이메일·카카오로 시작해요.<br>회원가입과 로그인을 확인할 수 있어요.</p>
      </a>
    </div>
    <p class="note">확인하고 싶은 화면을 선택해 주세요.</p>
